note: >-
  iboss operates no dedicated trust-center subdomain (no trust.iboss.com), but it does
  publish a real, substantive compliance and certifications page listing named, dated
  attestations — which is the surface the trust_center check is looking for. The
  automated probe (probe-security-programs.py) returned trust=none because it looks for
  a trust-center host pattern; this artifact upgrades that to a searched result from the
  page itself. Certifications are recorded AS PUBLISHED BY iboss. API Evangelist has not
  audited or independently verified any of them.
