discrepancy_note: >-
  The /compliance page and /.well-known/brand-facts.json do not agree. The page lists
  ISO 27001, ISO 9001, SOC 1 Type II, CSA STAR L1/L2 and Cyber Essentials, which
  brand-facts.json omits; brand-facts.json lists FIPS 140-2, HIPAA, FERPA and GDPR,
  which the page does not surface as badges. The union is recorded above with the
  source of each. This is a real provider-side inconsistency worth reporting back:
  the machine-readable file iboss offers to AI engines is the LESS complete of the two.
