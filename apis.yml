aid: iboss
name: iboss
description: iboss, Inc. is a Boston-headquartered cybersecurity company founded in 2003 that operates
  an AI-powered, cloud-native Zero Trust SASE (Secure Access Service Edge) platform used by more than
  4,000 enterprise, US federal, state and local government, and K-12 education organizations. The platform
  consolidates Secure Web Gateway (SWG), Cloud Access Security Broker (CASB), Zero Trust Network Access
  (ZTNA), Data Loss Prevention (DLP), Remote Browser Isolation (RBI), SaaS Security Posture Management
  (SSPM), DNS security, SD-WAN and AI chat monitoring into a single containerized service in which each
  customer receives dedicated gateway containers rather than shared infrastructure. iboss is FedRAMP and
  StateRAMP authorized and holds SOC 2 Type II, FIPS 140-2, HIPAA, CJIS, FERPA and GDPR alignment. Platform
  administration and reporting run over an authenticated REST surface at api.ibosscloud.com/ibcloud/web,
  which third parties including Datadog, Axonius, Google Security Operations and D3 Security integrate
  against; iboss publishes no public OpenAPI definition, developer portal or API reference, and its documentation
  host redirects to a sign-in-gated GitBook space.
