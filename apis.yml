apis:
- name: iboss Zero Trust SSE Platform API
  description: Authenticated REST administration and reporting surface for the iboss Zero Trust SASE/SSE
    cloud platform, served under the /ibcloud/web path on the iboss cloud gateway hosts. Probed anonymously
    it answers HTTP 401 and issues XSRF-TOKEN and JSESSIONID cookies scoped to /ibcloud, confirming a
    live authenticated API rather than a static site. iboss publishes no public OpenAPI/Swagger definition
    and no public API reference; access requires an active iboss Zero Trust SSE account with administrative
    privileges. Recorded here from probe evidence only — no contract was found, and none has been authored
    on the provider's behalf.
  humanURL: https://www.iboss.com/support
